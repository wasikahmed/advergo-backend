# Production stack. `web` binds directly to a host port (8000) -- point your
# own reverse proxy / Cloudflare Tunnel / whatever at it.
#
# Note --env-file: `env_file: .env.prod` below only injects vars *into the
# containers*. The ${POSTGRES_*} substitutions in this YAML itself are
# resolved by Compose from a *different* mechanism and need --env-file
# pointed at the same file explicitly:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-advergo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-advergo}
    volumes:
      - advergo_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-advergo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - advergo_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "8000:8000"
    volumes:
      - advergo_media_prod:/app/media
      - advergo_static_prod:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env.prod
    volumes:
      - advergo_media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  advergo_pgdata_prod:
  advergo_redisdata_prod:
  advergo_media_prod:
  advergo_static_prod:
